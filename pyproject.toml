[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "autovisor-desktop"
version = "0.3.0b1"
description = "Windows desktop visual derivative of Autovisor"
readme = "README-course.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = ["Pillow>=11,<13", "numpy>=2,<3", "opencv-python>=4.10,<5", "rapidocr==3.9.2", "onnxruntime>=1.20,<2", "PyAutoGUI==0.9.54", "httpx>=0.28,<1", "keyring>=25,<26", "sv-ttk>=2.6,<3"]
[project.gui-scripts]
autovisor-desktop = "desktop_app.gui:main"
[tool.setuptools.packages.find]
include = ["desktop_app*", "modules"]
